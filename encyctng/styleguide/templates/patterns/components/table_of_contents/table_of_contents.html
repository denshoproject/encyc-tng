<ul class="in-page-nav__container">
  {% for item in table_of_contents %}
  <li class="in-page-nav__item toc-level_{{ item.level }}">
    <a name="toc-{{ item.name }}" href="#{{ item.name }}"
       class="in-page-nav__link meta meta--large"
       style="padding-left: {{ item.indent }}px;">
      {{ item.title }}
    </a>
  </li><!-- .in-page-nav__item -->
  {% endfor %}
</ul><!-- .in-page-nav__container -->
