{% load wagtailimages_tags %}
<div class="ddrobject full-width-image{% if modifier %} full-width-image--{{ modifier }}{% endif %}">
    <div class="full-width-image__container meta meta--small">
        <div class="full-width-image__wrapper">
            <img class="full-width-image__image"
		 src="{{ item.meta.image_url }}"
		 alt="{{ item.caption.source }}" />
        </div>
        <p class="full-width-image__type">{{ item.type }}</p>
        <p class="full-width-image__caption">{{ item.caption }}</p>
        <button class="full-width-image__button meta meta--small"
		data-modal-trigger data-modal-id="{{ item.modal_id }}"
		aria-label="View more information about this image">
            {% include "patterns/components/icons/icon.html" with name="expand" classname="full-width-image__icon" %}
            <span class="full-width-image__button-text">More info</span>
        </button>
    </div>
</div>

{% if item.modal %}
    {% include "patterns/components/modal/modal.html" with modal=item.modal %}
{% endif %}
